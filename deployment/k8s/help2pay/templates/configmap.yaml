apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "help2pay.fullname" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "Help2Pay": {
        "PaymentServiceBaseUrl": "http://payment-api"
      },
      "Logging": {
        "LogLevel": {
          "Microsoft.AspNetCore.HttpLogging": "Information",
          "Tgs.Payment.Help2Pay.Help2PayOptions": "Information"
        }
      }
    }
  monitor.settings.json: |
    {
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
