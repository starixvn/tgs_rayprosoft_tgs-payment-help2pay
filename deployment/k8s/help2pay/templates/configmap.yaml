apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "help2pay.fullname" . }}
  namespace: {{ .Release.Namespace }}
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "Redis": "{{ .Values.connectionString.redis }}"
      },
      "Help2Pay": {
        "PaymentDepositApiUrl": "{{ .Values.paymentDepositApiUrl }}",
        "PaymentWithdrawApiUrl": "{{ .Values.paymentWithdrawApiUrl }}",
        "PaymentQueryApiUrl": "{{ .Values.paymentQueryApiUrl }}",
        "NatsUrl": "{{ .Values.nats }}",
        "CallbackBaseUrl": "{{ .Values.callbackBaseUrl }}",
        "PaymentServiceBaseUrl": "{{ .Values.paymentServiceBaseUrl }}"
      }
    }
