# Default values for help2pay.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: harbor.rpgp.cc/tgs/payment-help2pay
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

namespace: dev

imagePullSecrets:
  - name: secret-tgs-harbor

nameOverride: "payment-help2pay"
fullnameOverride: "payment-help2pay"

connectionString:
  redis: localhost,abortConnect=false,connectTimeout=3000

nats: nats://localhost:4222

paymentDepositApiUrl: https://api.testingzone88.com
paymentWithdrawApiUrl: https://app.testingzone88.com
paymentQueryApiUrl: https://query.testingzone88.com
callbackBaseUrl: https://dev-payment.rpgp.cc/help2pay
paymentServiceBaseUrl: http://payment-api

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 200m
    memory: 400Mi
  requests:
    cpu: 200m
    memory: 400Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
